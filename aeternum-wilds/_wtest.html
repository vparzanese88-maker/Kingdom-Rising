<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#88b4e0}</style></head><body>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { G } from './src/state.js';
import { buildWeapon } from './src/gfx/items/weapons.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 900, H = +q.get('h') || 600;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.25; r.shadowMap.enabled = true;
document.body.appendChild(r.domElement); G.renderer = r;
const s = new THREE.Scene(); s.background = new THREE.Color(0x9cc4e8);
s.add(new THREE.HemisphereLight(0xdfefff, 0x5a4a32, 1.15)); const sun = new THREE.DirectionalLight(0xfff0d8, 2.1); sun.position.set(3, 6, 4); s.add(sun);
const types = (q.get('types') || 'sword,greataxe,hammer,staff,bow,shield').split(','); const tiers = (q.get('tiers') || '1,2,3').split(',').map(Number); const rar = +(q.get('rar') || 0);
const cam = new THREE.PerspectiveCamera(+q.get('fov') || 30, W / H, 0.01, 50);
const spin = +(q.get('spin') || 0.6);
types.forEach((t, i) => tiers.forEach((tr, j) => {
  const g = buildWeapon(t, tr, { rarity: rar, raw: true });
  const n = types.length * tiers.length, k = i * tiers.length + j, gap = +(q.get('gap') || 0.75);
  g.position.set((k - (n - 1) / 2) * gap, -0.6, 0);
  if (t === 'shield' || t === 'bow') g.position.y += 0.6;
  g.rotation.y = spin + (t === 'bow' ? 1.2 : 0); s.add(g);
}));
const d = +(q.get('d') || 7.5); cam.position.set(0, 0.3, d); cam.lookAt(0, 0.1, 0);
if (q.get('cx')) { cam.position.set(+q.get('cx'), +q.get('cy'), +q.get('cz')); cam.lookAt(+q.get('lx'), +q.get('ly'), +q.get('lz')); }
r.render(s, cam); window.done = true;
</script></body></html>
