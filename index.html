<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kingdom Rising</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap">
<style>
/* Layout: full-bleed game canvas; wood-and-brass HUD panels float over it, grouped at the screen edges. Single deliberate dark look. */
:root {
  color-scheme: dark;
  --ink: #120e0a;          /* deepest panel */
  --wood: #2a1f16;         /* panel body */
  --wood-2: #3a2a1c;       /* raised panel */
  --brass: #c9a45c;        /* trim, accents */
  --brass-hi: #f0d48a;
  --parch: #efe3c8;        /* primary text */
  --parch-dim: #b9a989;    /* secondary text */
  --hp: #c8473a; --mana: #3f86c4; --xp: #c9a12a; --good: #8fe07a; --bad: #ff8a6a; --gold: #ffd84a;
  --f-disp: "IM Fell English SC", "Palatino Linotype", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --r: 6px;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: #0b0a0f; color: var(--parch); font: 15px/1.4 var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; touch-action: none; }
button { font: inherit; color: inherit; }
#game { position: fixed; inset: 0; display: block; }
#screen { position: fixed; inset: 0; z-index: 50; overflow: auto; }
#ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
#ui > * { pointer-events: auto; }
:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

/* ---------- shared controls ---------- */
.btn { background: linear-gradient(#4a3624, #2f2216); border: 1px solid var(--brass); border-radius: var(--r); padding: 8px 14px; color: var(--parch); cursor: pointer; font-weight: 600; letter-spacing: .02em; box-shadow: inset 0 1px 0 rgba(255,230,170,.18); }
.btn:hover:not(:disabled) { background: linear-gradient(#5c4430, #3a2a1c); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.gold { background: linear-gradient(#d6ad5c, #8e6a2a); color: #1a1208; border-color: var(--brass-hi); }
.btn.gold:hover:not(:disabled) { background: linear-gradient(#e8c272, #a07a34); }
.btn.ghost { background: rgba(20,14,10,.55); }
.btn.danger { border-color: #a8483a; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.big { padding: 12px 26px; font-size: 18px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.col { display: flex; flex-direction: column; gap: 10px; }
.dim { color: var(--parch-dim); }
.small { font-size: 12.5px; }
.good { color: var(--good); } .bad { color: var(--bad); } .gold { color: var(--gold); }
.hint { color: var(--parch-dim); font-size: 13px; margin: 6px 0; }
.empty-note { color: var(--parch-dim); font-style: italic; padding: 10px 4px; }
.pill { font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--brass); color: var(--brass-hi); white-space: nowrap; }
kbd { display: inline-block; min-width: 18px; padding: 0 5px; border: 1px solid var(--brass); border-bottom-width: 2px; border-radius: 4px; font: 600 12px var(--f-body); text-align: center; background: var(--ink); margin: 0 1px; }
input, textarea { background: var(--ink); border: 1px solid #6a5434; color: var(--parch); border-radius: 4px; padding: 6px 8px; font: inherit; }
textarea { font-family: ui-monospace, Menlo, monospace; font-size: 13px; resize: vertical; }
.mini { width: 24px; height: 22px; padding: 0; border-radius: 4px; border: 1px solid var(--brass); background: var(--wood-2); cursor: pointer; line-height: 1; }


/* ---------- weaknesses on the target frame, interrupted cast ---------- */
.tf-aff { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-top: 5px; font: 600 11px 'Alegreya Sans', sans-serif; }
.tf-aff small { color: #e8c868; letter-spacing: .06em; text-transform: uppercase; font-size: 10px; margin-right: 1px; } .tf-aff small.r { color: #a8a8b8; margin-left: 6px; } .tf-aff small.none { color: #8a8070; text-transform: none; letter-spacing: 0; font-weight: 500; }
.tf-aff .aff { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-size: 13px; cursor: help; }
.tf-aff .aff.weak { background: rgba(255,200,70,0.16); border: 1px solid rgba(255,210,90,0.85); box-shadow: 0 0 6px rgba(255,200,70,0.35); }
.tf-aff .aff.res { background: rgba(120,120,140,0.2); border: 1px solid rgba(170,170,190,0.55); filter: saturate(0.5); position: relative; }
.tf-aff .aff.res::after { content: ''; position: absolute; left: 3px; right: 3px; top: 50%; height: 2px; background: rgba(255,90,80,0.85); transform: rotate(-35deg); }
.hud-cast.interrupted .bar.cast i { background: linear-gradient(90deg, #8a1a1a, #d83a2a) !important; }
.hud-cast.interrupted #cb-t { color: #ffd0c8; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
/* ---------- new hero story ---------- */
.story { position: fixed; inset: 0; z-index: 2100; background: #000; animation: vicIn .6s ease; } .story.out { opacity: 0; transition: opacity .6s; }
.story canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
.story .st-cap { position: absolute; left: 50%; bottom: 3.5%; transform: translate(-50%, 10px); width: min(900px, calc(100vw - 32px)); padding: 12px 24px 14px; border-radius: 12px; background: linear-gradient(180deg, rgba(14,10,8,0.55), rgba(14,10,8,0.88)); border: 1px solid rgba(240,200,120,0.3); text-align: center; opacity: 0; transition: opacity 1s, transform 1s; pointer-events: none; }
.story .st-cap.in { opacity: 1; transform: translate(-50%, 0); }
.story .st-k { font: 700 11px/1 'Alegreya Sans', sans-serif; letter-spacing: .3em; text-transform: uppercase; color: #c8a868; }
.story .st-t { font: 400 clamp(26px, 3.6vw, 42px)/1.1 var(--f-disp); color: #ffe6a8; margin: 6px 0 8px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
.story .st-b { font: 400 clamp(15px, 1.5vw, 19px)/1.5 'Alegreya Sans', sans-serif; color: #f0e4c8; margin: 0; }
.story .st-nav { position: absolute; right: 18px; top: 2%; display: flex; gap: 10px; align-items: center; z-index: 2; }
.story .st-dots { display: flex; gap: 6px; margin-right: 8px; } .story .st-dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.25); } .story .st-dots i.br { background: rgba(255,216,74,0.3); } .story .st-dots i.on { background: #ffd84a; }
/* ---------- tips ---------- */
.tip-card { box-sizing: border-box; position: fixed; left: 14px; top: 152px; z-index: 60; width: min(380px, calc(100vw - 28px)); display: flex; gap: 12px; padding: 14px 16px 12px 14px; border-radius: 12px; background: linear-gradient(160deg, rgba(42,30,18,0.97), rgba(22,16,12,0.97)); border: 1px solid rgba(240,200,120,0.55); box-shadow: 0 10px 30px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,230,170,0.12); color: #f0e4c8; font: 14px/1.45 'Alegreya Sans', sans-serif; opacity: 0; transform: translateX(-16px); transition: opacity .25s, transform .25s; }
.tip-card.in { opacity: 1; transform: none; } .tip-card.narrow { width: 290px; font-size: 13px; } .tip-card.narrow .tc-ic { flex-basis: 34px; height: 34px; font-size: 18px; }
.tip-card.urgent { border-color: rgba(255,140,100,0.75); }
.tip-card .tc-ic { flex: 0 0 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: radial-gradient(circle at 35% 30%, #6a4a20, #2a1a0c); border: 1px solid rgba(240,200,120,0.6); }
.tip-card .tc-m { flex: 1; min-width: 0; }
.tip-card .tc-k { font: 700 10px/1 'Alegreya Sans', sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #c8a868; }
.tip-card .tc-t { font: 400 19px/1.2 var(--f-disp); color: #ffe6a8; margin: 3px 0 5px; }
.tip-card .tc-b { color: #e8dcc0; } .tip-card .tc-b b { color: #fff3d0; } .tip-card .tc-b .g { color: #ffd84a; }
.tip-card kbd { display: inline-block; min-width: 18px; padding: 0 5px; margin: 0 1px; border-radius: 4px; background: #3a2e20; border: 1px solid #8a6a3a; border-bottom-width: 2px; color: #ffe6a8; font: 700 12px/18px 'Alegreya Sans', sans-serif; text-align: center; }
.tip-card .tc-f { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.tip-card .tc-off { background: none; border: 0; color: #a89878; font: 13px 'Alegreya Sans', sans-serif; cursor: pointer; text-decoration: underline; padding: 0; }
.tip-card .tc-x { position: absolute; right: 6px; top: 4px; background: none; border: 0; color: #a89878; cursor: pointer; font-size: 14px; }
.tip-hl { animation: tipHl 1.2s ease-in-out 6; border-radius: 10px; } @keyframes tipHl { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,216,74,0); } 50% { box-shadow: 0 0 0 4px rgba(255,216,74,0.85), 0 0 22px rgba(255,216,74,0.6); } }
.hb-slot.hb-new { animation: hbNew 0.9s ease-in-out infinite; } @keyframes hbNew { 0%, 100% { box-shadow: inset 0 0 0 2px rgba(255,216,74,0.35), 0 0 0 rgba(255,216,74,0); border-color: #8a6a3a; } 50% { box-shadow: inset 0 0 0 2px #ffd84a, 0 0 16px 3px rgba(255,216,74,0.9); border-color: #ffd84a; background-color: rgba(255,216,74,0.18); } }
.mm-tipchk { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: rgba(0,0,0,0.25); border: 1px solid rgba(240,200,120,0.25); color: #e8dcc0; font: 14px/1.3 'Alegreya Sans', sans-serif; cursor: pointer; } .mm-tipchk input { margin-top: 2px; accent-color: #d8a84a; }
/* ---------- cover page ---------- */
#gate.cover-on, #gate:has(.cv-bg) { display: block; padding: 0; cursor: pointer; background: #000; overflow: hidden; }
#gate .cv-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
#gate .cv-title { position: absolute; left: 50%; top: 9%; transform: translateX(-50%); max-width: 92vw; pointer-events: none; }
#gate .cv-sub { position: absolute; left: 0; right: 0; top: calc(9% + min(18vw, 210px)); text-align: center; font: 600 clamp(16px, 2.4vw, 26px)/1.2 'Cinzel', var(--f-disp), serif; letter-spacing: 0.3em; text-transform: uppercase; color: #ffd8a0; text-shadow: 0 0 18px rgba(255,100,30,0.9), 0 2px 0 #2a0800; opacity: 0; transition: opacity 1.6s; pointer-events: none; }
#gate.t-done .cv-sub { opacity: 1; }
#gate .cv-click { position: absolute; left: 0; right: 0; bottom: 5%; text-align: center; font: 600 clamp(14px, 1.7vw, 19px)/1.3 'Alegreya Sans', sans-serif; letter-spacing: 0.14em; color: #f4e6c0; text-shadow: 0 2px 8px #000, 0 0 14px rgba(255,120,40,0.6); animation: cvPulse 2.2s ease-in-out infinite; padding: 0 16px; }
@keyframes cvPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
#gate .cv-snd { position: absolute; right: 16px; top: 14px; width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,200,140,0.4); background: rgba(0,0,0,0.45); color: #ffd8a0; font-size: 19px; cursor: pointer; }
#gate .cv-snd.on { border-color: #ffd84a; }
#gate.out { opacity: 0; transition: opacity 0.45s; }
.hv-bar { position: fixed; left: 50%; bottom: 128px; transform: translateX(-50%); z-index: 40; min-width: 220px; padding: 6px 10px 8px; border-radius: 8px; background: rgba(20,14,10,0.85); border: 1px solid rgba(240,200,120,0.4); color: #f4e6c0; font: 600 13px 'Alegreya Sans', sans-serif; text-align: center; pointer-events: none; }
.hv-bar i { display: block; height: 6px; margin-top: 5px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; } .hv-bar b { display: block; height: 100%; background: linear-gradient(90deg, #c8955a, #ffd84a); }
.mm-danger { margin-top: 28px; padding: 14px 16px; border: 1px solid rgba(255,90,70,0.45); border-radius: 10px; background: rgba(120,20,10,0.18); } .mm-danger h3 { margin: 0 0 6px; color: #ff9a8a; } .mm-danger p { margin: 0 0 10px; }
/* ---------- gate / loading / enter ---------- */
#loading, #gate { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: radial-gradient(ellipse at center, #2a1f16 0%, #0b0a0f 70%); text-align: center; padding: 16px; }
#gate h1, .logo h1 { font: 400 clamp(40px, 8vw, 84px)/1 var(--f-disp); margin: 0; color: var(--brass-hi); text-shadow: 0 2px 0 #3a2410, 0 0 30px rgba(240,180,80,.25); letter-spacing: .02em; }
#gate p { color: var(--parch-dim); max-width: 46ch; margin: 14px auto 22px; }
.spin { width: 38px; height: 38px; border: 3px solid rgba(201,164,92,.25); border-top-color: var(--brass-hi); border-radius: 50%; animation: sp 0.9s linear infinite; margin: 0 auto 12px; }
@keyframes sp { to { transform: rotate(360deg); } }
.enter { position: fixed; inset: 0; display: grid; place-content: center; background: #0b0a0f; color: var(--parch-dim); text-align: center; }

/* ---------- intro ---------- */
.mm { position: relative; min-height: 100vh; display: grid; grid-template-columns: 250px minmax(0, 1fr); grid-template-rows: auto 1fr; gap: 18px 28px; padding: 28px clamp(16px, 3vw, 48px); box-sizing: border-box; }
.mm-title { grid-column: 1 / -1; text-align: center; } .mm-title h1 { font: 400 clamp(42px, 7vw, 88px)/1 var(--f-disp); margin: 0; color: var(--brass-hi); letter-spacing: .04em; text-shadow: 0 3px 0 #3a2410, 0 0 40px rgba(255,190,90,.35), 0 0 2px #000; }
.mm-title p { margin: 6px 0 0; color: #e8d8b8; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; text-shadow: 0 1px 3px #000; } .mm-crest { font-size: 30px; color: var(--brass-hi); text-shadow: 0 0 18px rgba(255,200,100,.6); }
.mm-nav { display: flex; flex-direction: column; gap: 8px; align-self: start; } .mm-tab { display: flex; align-items: center; gap: 12px; padding: 12px 16px; font: 600 16px var(--f-disp, serif); color: #f0e0c0; text-align: left; background: linear-gradient(90deg, rgba(40,28,18,.88), rgba(40,28,18,.55)); border: 1px solid #6a5434; border-left: 4px solid #6a5434; border-radius: 6px; cursor: pointer; transition: all .15s; }
.mm-tab span { width: 22px; text-align: center; } .mm-tab:hover { border-left-color: var(--brass-hi); transform: translateX(4px); color: #fff; } .mm-tab.on { background: linear-gradient(90deg, rgba(120,80,30,.92), rgba(70,48,24,.7)); border-color: var(--brass); border-left-color: var(--brass-hi); color: #fff3d0; }
.mm-realm { margin-top: 14px; padding: 10px 12px; background: rgba(20,14,10,.75); border: 1px solid #4a3828; border-radius: 6px; display: flex; flex-direction: column; gap: 6px; } .mm-realm div { display: flex; justify-content: space-between; } .mm-realm b { color: var(--fc); } .mm-realm span { color: #ffd27a; letter-spacing: 2px; } .mm-realm small { color: #a8987c; }
.mm-panel { align-self: start; min-width: 0; } .mm-hero { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 420px); gap: 20px; align-items: end; justify-content: space-between; } .mm-info { padding: 18px 20px; background: linear-gradient(rgba(24,18,12,.72), rgba(24,18,12,.9)); border: 1px solid #6a5434; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.5); backdrop-filter: blur(2px); }
.mm-stage { position: relative; } .mm-stage canvas { width: 100%; max-width: 380px; height: auto; display: block; } .mm-rot { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
.mm-info h2 { font: 400 clamp(28px, 4vw, 46px)/1.05 var(--f-disp); color: var(--brass-hi); margin: 0; text-shadow: 0 2px 0 #2a1a0c; } .mm-cls { font-size: 17px; color: #f0e0c0; margin: 6px 0 14px; }
.mm-info dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 20px; font-size: 15px; } .mm-info dt { color: #a8987c; } .mm-info dd { margin: 0; color: #f6ecd6; } .btn.big { font-size: 20px; padding: 14px 28px; } .mm-enter { width: 100%; box-shadow: 0 0 24px rgba(255,190,90,.35); }
.mm-roster { margin-top: 14px; } .mm-roster h3 { margin: 0 0 8px; color: #f0e0c0; font: 400 20px var(--f-disp); text-shadow: 0 1px 3px #000; } .mm-roster h3 small { color: #a8987c; font-size: 13px; }
.mm-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; } .mm-list.wide { grid-template-columns: 1fr; }
.mm-card { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: rgba(30,22,14,.82); border: 1px solid #5a4430; border-radius: 8px; color: #f0e0c0; text-align: left; cursor: pointer; } .mm-card:hover { border-color: var(--brass); } .mm-card.on { border-color: var(--brass-hi); box-shadow: 0 0 0 1px var(--brass-hi), 0 0 16px rgba(255,200,100,.25); background: rgba(70,48,24,.9); }
.mm-card span { display: flex; flex-direction: column; min-width: 0; flex: 1; } .mm-card small { color: #c8b898; } .mm-card.del { cursor: default; } .mm-card.del .btn { margin-left: auto; }
.mm-guide { padding: 18px 22px; background: linear-gradient(rgba(24,18,12,.72), rgba(24,18,12,.9)); border: 1px solid #6a5434; border-radius: 12px; max-width: 820px; } .mm-guide h2 { font: 400 30px var(--f-disp); color: var(--brass-hi); margin: 0 0 8px; } .mg-goal { font-size: 16px; line-height: 1.55; color: #f6e7c4; margin: 0 0 12px; padding: 10px 14px; border-left: 3px solid var(--brass); background: rgba(255,210,120,.07); border-radius: 0 8px 8px 0; } .mg-steps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin-bottom: 12px; } .mg-step { display: flex; gap: 10px; align-items: flex-start; } .mg-step > span { flex: 0 0 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--brass); color: #1a120a; font-weight: 700; } .mg-step b { color: var(--brass-hi); font-size: 15px; } .mg-step p { margin: 3px 0 0; font-size: 13.5px; line-height: 1.5; color: #e6d8b8; } .mm-guide .dim { font-size: 13.5px; margin: 0 0 10px; } @media (max-width: 760px) { .mg-steps { grid-template-columns: 1fr; } }
.mm-del, .mm-hist, .mm-opt, .mm-empty { padding: 20px 24px; background: linear-gradient(rgba(24,18,12,.65), rgba(24,18,12,.85)); border: 1px solid #6a5434; border-radius: 12px; max-width: 720px; } .mm-del h2, .mm-hist h2, .mm-opt h2, .mm-empty h2 { font: 400 30px var(--f-disp); color: var(--brass-hi); margin: 0 0 10px; } .mm-hist p { font-size: 15.5px; line-height: 1.6; color: #efe2c6; }
.mm-opt { display: flex; flex-direction: column; gap: 12px; } .mm-empty { text-align: center; }
.mm-play { display: flex; flex-direction: column; gap: 10px; }
.mm-online { padding: 18px 22px; background: linear-gradient(rgba(24,18,12,.72), rgba(24,18,12,.9)); border: 1px solid #6a5434; border-radius: 12px; max-width: 900px; } .mm-online h2 { font: 400 30px var(--f-disp); margin: 0 0 6px; color: var(--brass-hi); }
.mo-as { margin: 0 0 10px; color: #e8d8b8; } .mo-as .btn { margin-left: 6px; }
.mo-msg { min-height: 1.4em; margin: 0 0 10px; color: var(--good); } .mo-msg.bad { color: var(--bad); }
.mo-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.mo-box { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid #5a4630; border-radius: 10px; background: rgba(10,8,6,.35); min-width: 0; } .mo-box h3 { margin: 0; font: 400 20px var(--f-disp); color: #f0d48a; } .mo-box p { margin: 0; }
.mo-box label { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--parch-dim); }
.mo-box input { font: inherit; font-size: 15px; color: var(--parch); background: rgba(0,0,0,.45); border: 1px solid #6a5434; border-radius: 6px; padding: 7px 9px; }
.mo-box input:disabled, .mo-box .btn:disabled { opacity: .5; }
.mo-list { display: flex; flex-direction: column; gap: 6px; max-height: 210px; overflow: auto; }
.mo-row { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid #4a3a28; border-radius: 8px; background: rgba(40,28,18,.6); } .mo-row span { flex: 1; min-width: 0; display: flex; flex-direction: column; } .mo-row small { color: var(--parch-dim); font-size: 12px; overflow-wrap: anywhere; }
