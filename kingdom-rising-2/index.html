<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kingdom Rising II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
:root{ color-scheme: dark; --ink:rgba(14,11,8,.86); --ink2:rgba(28,22,16,.92); --line:rgba(214,178,106,.45); --gold:#e2bd6a; --gold2:#ffe2a0; --text:#f3e9d2; --dim:#b8aa8c;
  --hp:#d23c32; --mana:#3f8ad8; --end:#e0b030; --xp:#9b6cff; --good:#7ee07a; --bad:#ff7a6a; --f-t:"Cinzel",Georgia,serif; --f-b:"Alegreya Sans","Segoe UI",system-ui,sans-serif; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#07060a;color:var(--text);font:16px/1.4 var(--f-b);user-select:none;-webkit-user-select:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:linear-gradient(#3a2c1a,#24190e);border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:6px;font-weight:700;letter-spacing:.03em;transition:.12s}
.btn:hover{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 14px rgba(226,189,106,.25)}
.btn.big{font-family:var(--f-t);font-size:22px;padding:16px 28px}
.btn.gold{background:linear-gradient(#c9973c,#7a5418);color:#1a1006;border-color:#ffd98a}
.btn.gold:hover{color:#000;box-shadow:0 0 20px rgba(255,210,120,.45)}
.btn.red{background:linear-gradient(#6a1e1a,#3a0e0c);border-color:#c0504a}
.btn:disabled{opacity:.4;cursor:not-allowed}
.panel{background:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
h1,h2,h3{font-family:var(--f-t);margin:0;color:var(--gold2)}
/* ---------- TITLE ---------- */
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:6vh 16px 3vh;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 30%,rgba(0,0,0,.65) 100%)}
#title .logo{text-align:center;margin-bottom:3vh}
#title .logo h1{font-size:clamp(44px,8vw,100px);font-weight:900;letter-spacing:.04em;text-shadow:0 4px 30px rgba(0,0,0,.9),0 0 50px rgba(255,190,90,.35);background:linear-gradient(#fff2c8,#e2a940 60%,#9a6418);-webkit-background-clip:text;background-clip:text;color:transparent}
#title .logo p{margin:4px 0 0;font-family:var(--f-t);color:var(--gold);letter-spacing:.4em;font-size:15px;text-shadow:0 2px 8px #000}
#title .menu{width:min(560px,100%);display:flex;flex-direction:column;gap:12px;overflow:auto;padding:4px}
#saves{display:flex;flex-direction:column;gap:10px}
.save{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--ink);border:1px solid var(--line);border-radius:10px;transition:.12s}
.save:hover{border-color:var(--gold);background:var(--ink2)}
.save .crest{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:radial-gradient(#4a3418,#1a1208);border:2px solid var(--gold)}
.save .info{flex:1;min-width:0}
.save .info b{font-family:var(--f-t);font-size:20px;color:var(--gold2)}
.save .info .sub{color:var(--dim);font-size:14px}
.save .info .meta{display:flex;gap:14px;font-size:13px;color:var(--text);margin-top:2px;flex-wrap:wrap}
.save .acts{display:flex;gap:6px}
.slotcount{color:var(--dim);font-size:14px;text-align:center}
#title .foot{margin-top:auto;display:flex;gap:10px;padding-top:12px}
.confirm{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.6);z-index:80}
.confirm .panel{padding:24px;max-width:420px;text-align:center}
.confirm .row{display:flex;gap:10px;justify-content:center;margin-top:16px}
/* ---------- CREATOR ---------- */
#creator{position:fixed;inset:0;display:grid;grid-template-columns:minmax(360px,520px) 1fr;pointer-events:none}
#creator .side{pointer-events:auto;background:linear-gradient(90deg,rgba(10,8,6,.95),rgba(10,8,6,.85));border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px;gap:14px;overflow:hidden}
#creator .tabs{display:flex;gap:4px;flex-wrap:wrap}
#creator .tab{flex:1;min-width:70px;padding:9px 6px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:6px;font-family:var(--f-t);font-size:13px;color:var(--dim)}
#creator .tab.on{background:linear-gradient(#5a4220,#2e200e);color:var(--gold2);border-color:var(--gold)}
#creator .body{flex:1;overflow:auto;padding-right:4px}
.choice{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.card{padding:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;text-align:left;transition:.1s}
.card:hover{border-color:var(--gold)}
.card.on{border-color:var(--gold2);background:rgba(226,189,106,.16);box-shadow:inset 0 0 0 1px var(--gold)}
.card b{display:block;font-family:var(--f-t);color:var(--gold2);font-size:17px}
.card small{color:var(--dim);font-size:13px;line-height:1.3;display:block;margin-top:4px}
.card .ico{font-size:26px}
.desc{margin-top:12px;padding:12px;background:rgba(0,0,0,.3);border-left:3px solid var(--gold);border-radius:4px;color:var(--text);font-size:15px}
.statrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.statrow span{background:rgba(255,255,255,.06);padding:4px 10px;border-radius:12px;font-size:14px}
.field{margin:12px 0}
.field label{display:block;color:var(--gold);font-family:var(--f-t);font-size:14px;margin-bottom:6px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.2)}
.sw.on{border-color:var(--gold2);box-shadow:0 0 0 2px var(--gold)}
input[type=range]{width:100%;accent-color:var(--gold)}
input[type=text]{width:100%;padding:12px;font:inherit;font-size:20px;background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--text);border-radius:6px}
#creator .nav{display:flex;gap:10px;justify-content:space-between}
#creator .preview-label{position:absolute;right:24px;bottom:24px;color:var(--dim);font-size:14px;pointer-events:none;text-align:right}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#crosshair{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 3px #000}
#crosshair.hit{background:#ff5040;transform:scale(1.8)}
#prompt{position:absolute;left:50%;top:58%;transform:translateX(-50%);background:var(--ink);border:1px solid var(--line);padding:6px 14px;border-radius:20px;font-size:17px;white-space:nowrap}
#prompt kbd,.kbd{display:inline-block;min-width:24px;padding:1px 6px;margin-right:6px;background:#f3e9d2;color:#1a1208;border-radius:4px;font-weight:800;text-align:center;font-family:var(--f-b)}
#progress{position:absolute;left:50%;top:63%;width:260px;transform:translateX(-50%);text-align:center;font-size:15px;text-shadow:0 1px 3px #000}
#progress .bar{height:10px;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-top:4px}
#progress .bar i{display:block;height:100%;background:linear-gradient(90deg,#c9973c,#ffe2a0)}
#bottom{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
#bars{display:flex;flex-direction:column;gap:4px;width:440px}
.bar2{position:relative;height:18px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.bar2 i{position:absolute;inset:0 auto 0 0;transition:width .12s}
.bar2 span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800;text-shadow:0 1px 2px #000}
.bar2.hp{height:22px}.bar2.hp i{background:linear-gradient(#ef5a4a,#a01e18)}
.bar2.mana i{background:linear-gradient(#5aa8f0,#1e5aa0)} .bar2.end i{background:linear-gradient(#f2cc50,#a8781a)}
#abil{display:flex;gap:6px;align-items:flex-end}
.slot{position:relative;width:62px;height:62px;background:linear-gradient(#2a2016,#120d08);border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:28px;overflow:hidden}
.slot .k{position:absolute;left:3px;top:1px;font-size:12px;font-weight:800;color:var(--gold2);text-shadow:0 1px 2px #000}
.slot .n{position:absolute;right:3px;bottom:1px;font-size:13px;font-weight:800;text-shadow:0 1px 2px #000}
.slot .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) var(--p,0%),transparent 0);display:grid;place-items:center;font-size:18px;font-weight:800;text-shadow:0 1px 3px #000}
.slot.locked{filter:grayscale(1) brightness(.5)}
.slot .lock{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:rgba(0,0,0,.45);text-align:center;line-height:1.1}
.slot.ready{border-color:var(--gold2);box-shadow:0 0 10px rgba(255,220,140,.35)}
.slot.active{border-color:#fff}
.slot.flash{animation:flash .3s}
@keyframes flash{from{box-shadow:0 0 0 4px #fff}to{box-shadow:none}}
.slot.small{width:46px;height:46px;font-size:22px}
.sep{width:10px}
.wslots{display:flex;flex-direction:column;gap:4px}
.wslots .slot{width:46px;height:28px;font-size:16px;border-width:1px}
#xpbar{position:absolute;left:0;right:0;bottom:0;height:8px;background:rgba(0,0,0,.6)}
#xpbar i{display:block;height:100%;background:linear-gradient(90deg,#6a3cd0,#b48aff)}
#xpbar span{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;color:#d8c8ff;text-shadow:0 1px 2px #000;white-space:nowrap}
#lvl{position:absolute;left:18px;bottom:20px;display:flex;align-items:center;gap:10px}
#lvl .badge{width:56px;height:56px;border-radius:50%;background:radial-gradient(#4a3418,#1a1208);border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--f-t);font-size:24px;font-weight:900;color:var(--gold2)}
#lvl .nm{font-family:var(--f-t);font-size:18px;color:var(--gold2);text-shadow:0 1px 3px #000}
#lvl .cl{font-size:13px;color:var(--dim)}
#lvl .gold{font-size:14px;color:#ffd84a}
#buffs{position:absolute;left:50%;bottom:200px;transform:translateX(-50%);display:flex;gap:6px}
#buffs .b{background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:13px}
#target{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:340px;text-align:center}
#target .nm{font-family:var(--f-t);font-size:18px;text-shadow:0 1px 3px #000}
#target .bar2{height:16px;margin-top:3px}
#target .bar2 i{background:linear-gradient(#ef5a4a,#a01e18)}
#mapbox{position:absolute;right:18px;top:16px;width:190px;text-align:center}
#mini{width:190px;height:190px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 0 2px #000,0 6px 20px rgba(0,0,0,.6);background:#000}
#zoneLbl{margin-top:4px;font-family:var(--f-t);font-size:15px;color:var(--gold2);text-shadow:0 1px 3px #000}
#zoneLbl small{display:block;font-family:var(--f-b);color:var(--dim);font-size:12px}
#tracker{position:absolute;right:18px;top:250px;width:270px;display:flex;flex-direction:column;gap:8px}
#tracker .q{background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.55));padding:6px 10px;border-right:3px solid var(--gold);text-align:right;text-shadow:0 1px 2px #000}
#tracker .q b{font-family:var(--f-t);color:var(--gold2);font-size:15px;display:block}
#tracker .q div{font-size:14px}
#tracker .q .ok{color:var(--good)}
#tracker .q.ready b::after{content:"  ✓ Turn in";color:var(--good);font-family:var(--f-b);font-size:13px}
#toasts{position:absolute;left:18px;top:40%;display:flex;flex-direction:column;gap:4px;width:320px}
.toast{background:linear-gradient(90deg,rgba(0,0,0,.7),rgba(0,0,0,0));padding:4px 10px;border-left:3px solid var(--gold);font-size:16px;text-shadow:0 1px 2px #000;animation:tin .2s}
.toast.bad{border-color:var(--bad);color:#ffd0c8}.toast.gold{border-color:#ffd84a;color:#ffe9a0}.toast.xp{border-color:#9b6cff;color:#dccaff}
.toast.r1{color:#7ee07a}.toast.r2{color:#6ab4ff}.toast.r3{color:#d08aff}.toast.r4{color:#ffaa40}
@keyframes tin{from{opacity:0;transform:translateX(-20px)}}
#banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .5s}
#banner.on{opacity:1}
#banner h2{font-size:clamp(34px,5vw,64px);font-weight:900;text-shadow:0 3px 20px #000,0 0 40px rgba(255,190,90,.5)}
#banner p{margin:4px 0 0;font-size:20px;text-shadow:0 2px 6px #000}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(160,0,0,.6));opacity:0;transition:opacity .15s}
#lowhp{position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(160,0,0,.6);opacity:0}
#plates{position:absolute;inset:0}
.plate{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;font-size:14px;text-shadow:0 1px 3px #000,0 0 2px #000}
.plate .mk{font-family:var(--f-t);font-size:42px;font-weight:900;line-height:1;color:#ffd84a;text-shadow:0 0 12px rgba(255,200,40,.8),0 2px 3px #000}
.plate .mk.grey{color:#a8a8a8;text-shadow:0 2px 3px #000}
.plate .tt{color:#9fd0ff;font-size:12px}
.plate .hpb{width:70px;height:6px;margin:2px auto 0;background:rgba(0,0,0,.7);border:1px solid rgba(0,0,0,.8)}
.plate .hpb i{display:block;height:100%;background:#d23c32}
.plate.hostile .nm{color:#ff8a7a}.plate.passive .nm{color:#f0e08a}.plate.npc .nm{color:#9fe8a0}.plate.elite .nm{color:#ffb040;font-weight:800}
#dmgLayer{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.dnum{position:absolute;left:0;top:0;font-family:var(--f-t);font-weight:900;font-size:24px;color:#fff;text-shadow:0 2px 3px #000,0 0 6px #000}
.dnum.crit{color:#ffd040;font-size:34px}.dnum.fire{color:#ff9a4a}.dnum.frost{color:#9ae0ff}.dnum.heal{color:#7eff7a}.dnum.miss{color:#ccc;font-size:18px}.dnum.dot{color:#ffb090;font-size:17px}.dnum.bad{color:#ff6a5a;font-size:22px}
#hint{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:16px;max-width:560px;text-align:center}
#clickToPlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35);pointer-events:auto;font-family:var(--f-t);font-size:26px;color:var(--gold2);text-shadow:0 2px 8px #000}
/* ---------- WINDOWS ---------- */
#windows{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}
.win{pointer-events:auto;position:relative;background:var(--ink2);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.7);max-width:96vw;max-height:90vh;display:flex;flex-direction:column}
.win>header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.win>header h2{font-size:22px}
.win .x{background:none;border:1px solid var(--line);border-radius:6px;width:34px;height:34px;font-size:18px}
.win .x:hover{border-color:var(--gold)}
.win .content{padding:14px 16px;overflow:auto}
.tabsrow{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabsrow button{padding:6px 12px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:6px}
.tabsrow button.on{background:rgba(226,189,106,.2);color:var(--gold2);border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(9,56px);gap:5px}
.cell{position:relative;width:56px;height:56px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);border-radius:6px;display:grid;place-items:center;font-size:26px}
.cell:hover{border-color:var(--gold)}
.cell.sel{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
.cell .n{position:absolute;right:3px;bottom:0;font-size:13px;font-weight:800;text-shadow:0 1px 2px #000}
.cell.r1{border-color:#5fd35f}.cell.r2{border-color:#4fa3ff}.cell.r3{border-color:#c06bff}.cell.r4{border-color:#ff9a2a}
.cell .eq{position:absolute;left:2px;top:0;font-size:10px;color:var(--gold2)}
.charlay{display:grid;grid-template-columns:260px auto;gap:16px}
.eqgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.eqslot{display:flex;align-items:center;gap:8px;padding:6px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);border-radius:6px;min-height:52px;font-size:13px}
.eqslot .i{font-size:24px;width:30px;text-align:center}
.eqslot small{display:block;color:var(--dim);font-size:11px}
.stats{margin-top:10px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.stats .s{color:var(--dim)}
.tip{margin-top:10px;padding:10px;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:8px;min-height:90px;font-size:14px}
.tip b{font-size:16px}
.tip .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tip .row button{padding:5px 10px;font-size:13px}
.craft{display:grid;grid-template-columns:180px 300px 300px;gap:12px;min-height:420px}
.cats button{display:block;width:100%;text-align:left;margin-bottom:4px;padding:8px 10px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:6px}
.cats button.on{background:rgba(226,189,106,.18);color:var(--gold2)}
.rlist{overflow:auto;max-height:60vh;display:flex;flex-direction:column;gap:4px}
.rlist button{display:flex;align-items:center;gap:8px;text-align:left;padding:6px 8px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);border-radius:6px}
.rlist button.on{border-color:var(--gold)}
.rlist button.can b{color:var(--good)}
.rlist button.no{opacity:.55}
.rlist .i{font-size:22px;width:28px;text-align:center}
.need{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
.need .ok{color:var(--good)}.need .no{color:var(--bad)}
.qlog{display:grid;grid-template-columns:260px 420px;gap:14px;min-height:380px}
.qlist button{display:block;width:100%;text-align:left;padding:8px;margin-bottom:4px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);border-radius:6px}
.qlist button.on{border-color:var(--gold)}
.dialog{width:min(620px,94vw)}
.dialog .who{display:flex;gap:12px;align-items:center}
.dialog .who .p{width:54px;height:54px;border-radius:50%;background:radial-gradient(#4a3418,#1a1208);border:2px solid var(--gold);display:grid;place-items:center;font-size:26px}
.dialog .text{margin:12px 0;font-size:18px;line-height:1.5}
.dialog .opts{display:flex;flex-direction:column;gap:6px}
.dialog .opts button{text-align:left;padding:10px 12px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:6px;font-size:16px}
.dialog .opts button:hover{border-color:var(--gold);color:var(--gold2)}
.obj{margin:6px 0;padding-left:10px;border-left:2px solid var(--gold)}
.reward{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;color:var(--gold2)}
.mapwin canvas{display:block;border-radius:8px;max-width:84vw;max-height:76vh}
.setgrid{display:grid;grid-template-columns:180px 260px;gap:12px 16px;align-items:center}
.setgrid label{color:var(--dim)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.pausemenu{display:flex;flex-direction:column;gap:10px;min-width:300px;padding:6px}
#death{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(rgba(60,0,0,.4),rgba(0,0,0,.85));pointer-events:auto}
#death h1{font-size:64px;color:#e04a3a;text-shadow:0 4px 20px #000}
/* intro */
#intro{position:fixed;inset:0;pointer-events:none}
#intro .lid{position:absolute;left:-10%;right:-10%;height:52%;background:#000;border-radius:50%}
#intro .lid.top{top:-2%}#intro .lid.bot{bottom:-2%}

<style id="ui2">
