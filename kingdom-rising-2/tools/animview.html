<!doctype html><html><head><meta charset="utf-8"><title>Anim view</title><style>body{margin:0;background:#556}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.min.js","three/addons/":"../vendor/three/examples/jsm/"}}</script></head><body>
<script type="module">
// animview: ?m=boar_walk&t=0.3 shows a model's first clip at time t (seconds), side view (a tool for checking animations)
import * as THREE from 'three'; import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search), R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setSize(480, 360); document.body.appendChild(R.domElement);
const S = new THREE.Scene(); S.add(new THREE.HemisphereLight('#fff', '#666', 2.5)); const C = new THREE.PerspectiveCamera(35, 4 / 3, 0.01, 100);
new GLTFLoader().load('../models/gi/' + q.get('m') + '.glb', g => { S.add(g.scene); const b = new THREE.Box3().setFromObject(g.scene), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3()), d = Math.max(s.x, s.y, s.z) * 2.2;
  C.position.set(c.x + d * (+q.get('side') || 1), c.y + d * 0.15, c.z + d * (q.get('side') ? 0 : 0.2)); C.lookAt(c);
  const mx = new THREE.AnimationMixer(g.scene); window.clips = g.animations.map(a => a.name + ':' + a.duration.toFixed(2)); if (g.animations[0]) { const a = mx.clipAction(g.animations[0]); a.play(); mx.update(+q.get('t') || 0); }
  R.render(S, C); window.done = true; });
</script></body></html>
