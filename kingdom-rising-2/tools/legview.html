<!doctype html><html><head><meta charset="utf-8"><base href="../"><title>Leg view</title><style>body{margin:0;background:#6a7a5a}</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.min.js","three/addons/":"./vendor/three/examples/jsm/"}}</script></head><body>
<script type="module">
// legview: ?m=boar&ph=1.57 shows an animal with the leg shader at a stride phase, side view (a tool for checking the legs)
import * as THREE from 'three'; import { loadGI, legShader } from './src/gimodels.js';
const q = new URLSearchParams(location.search), R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setSize(480, 320); document.body.appendChild(R.domElement);
const S = new THREE.Scene(); S.add(new THREE.HemisphereLight('#fff', '#666', 2.5)); const C = new THREE.PerspectiveCamera(35, 1.5, 0.01, 100);
loadGI(q.get('m')).then(g => { const o = g.scene.clone(); S.add(o); const U = { ph: { value: +q.get('ph') || 0 }, amp: { value: 1 } }; o.traverse(x => { if (x.isMesh) legShader(x, U, q.get('m') === 'crab'); });
  const b = new THREE.Box3().setFromObject(o), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3()), d = Math.max(s.x, s.y, s.z) * 2.3, side = s.x > s.z;
  C.position.set(c.x + (side ? 0 : d), c.y + d * 0.1, c.z + (side ? d : 0)); C.lookAt(c); R.render(S, C); window.done = true; });
</script></body></html>
