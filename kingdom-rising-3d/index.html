<script>
// load the 2D page's styles and game scripts, in order, then start the 3D renderer (js3d/main3d.js)
window.KR3D = true;
window.addEventListener('error', function (e) { if (e.filename && e.filename.indexOf('/js') < 0) return; if (window.KR && window.KR.Main && window.KR.Main.showFatal) window.KR.Main.showFatal(e.error || e.message); });
window.addEventListener('unhandledrejection', function (e) { try { e.preventDefault(); } catch (x) {} console.warn('Ignored async error:', e.reason); });
// if the world has not come up after a minute (a half-finished site update, or no WebGL), reload once with fresh files, then explain
setTimeout(function () {
  if (window.KR_BOOTED) return; let tried = false; try { tried = sessionStorage.getItem('kr_boot_retry') === '1'; sessionStorage.setItem('kr_boot_retry', '1'); } catch (e) {}
  if (!tried) { location.replace(location.pathname + '?fresh=' + Date.now()); return; }
  const el = document.getElementById('boot3d-msg'); if (el) el.innerHTML = 'The game could not start on this device (its graphics are not supported, or the files did not load).<br><br><button onclick="location.replace(location.pathname + \'?fresh=\' + Date.now())" class="btn gold">Try again</button>';
}, 60000);
window.addEventListener('load', function () { setTimeout(function () { if (window.KR_BOOTED) try { sessionStorage.removeItem('kr_boot_retry'); } catch (e) {} }, 65000); });
window.KR_READY = (async function () {
  const msg = (t) => { const el = document.getElementById('boot3d-msg'); if (el) el.textContent = t; };
  let html;
  try { const r = await fetch('../index.html', { cache: 'no-cache' }); if (!r.ok) throw new Error(r.status); html = await r.text(); }
  catch (e) { msg('Could not load the game files. Serve this folder over http (for example: python3 -m http.server) instead of opening the file directly.'); throw e; }
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const css = [...doc.querySelectorAll('style')].map((s) => s.textContent).join('\n');
  const st = document.createElement('style'); st.id = 'kr2d-css'; st.textContent = css; document.head.insertBefore(st, document.head.querySelector('link[href^="css3d"]'));
  const inline = [...doc.querySelectorAll('script:not([src])')].map((s) => s.textContent).join('\n');
  const m = /KR_VERSION\s*=\s*(\d+)/.exec(inline); window.KR_VERSION = m ? +m[1] : 1;
  const srcs = [...doc.querySelectorAll('script[src]')].map((s) => s.getAttribute('src')).filter((s) => !/(^|\/)main\.js(\?|$)/.test(s));
  await new Promise((resolve, reject) => {
    let left = srcs.length;
    srcs.forEach((src, i) => {
      const s = document.createElement('script'); s.src = '../' + src; s.async = false;
      s.onload = () => { msg('Loading the game files... ' + Math.round(((srcs.length - --left) / srcs.length) * 100) + '%'); if (!left) resolve(); };
      s.onerror = () => reject(new Error('Failed to load ' + src + '. The site may be updating: reload in a moment.'));
      document.body.appendChild(s);
    });
  });
  msg('Raising the world...');
})();
</script>
