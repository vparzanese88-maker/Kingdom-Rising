<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model viewer</title>
<!-- A developer tool: view one model of assets/models from several sides (viewer.html?m=dutch_ship_medium&a=0). -->
<style>html,body{margin:0;height:100%;background:#9fb6cc;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/examples/jsm/" } }</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search), name = q.get('m') || 'dutch_ship_medium';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb6cc);
scene.add(new THREE.HemisphereLight(0xbcd4f0, 0x5a4a38, 1.2)); const sun = new THREE.DirectionalLight(0xfff2dd, 3); sun.position.set(30, 50, 20); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, far: 200 }); scene.add(sun);
const sea = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x2a5a6e, roughness: 0.3, transparent: true, opacity: 0.85 })); sea.rotation.x = -Math.PI / 2; sea.receiveShadow = true; if (q.get('sea') !== '0') scene.add(sea);
const axes = new THREE.AxesHelper(8); axes.position.y = 0.05; scene.add(axes); // red +x, green +y, blue +z
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 1000);
new GLTFLoader().load(`assets/models/${name}.glb`, (g) => {
  const m = g.scene; m.traverse((o) => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } }); scene.add(m);
  const box = new THREE.Box3().setFromObject(m), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  window.info = { min: box.min.toArray().map((v) => +v.toFixed(2)), max: box.max.toArray().map((v) => +v.toFixed(2)), meshes: [] };
  m.traverse((o) => { if (o.isMesh) window.info.meshes.push(o.name); });
  const R = Math.max(s.x, s.y, s.z) * 1.15, a = +(q.get('a') || 0.6), e = +(q.get('e') || 0.3);
  cam.position.set(c.x + Math.cos(a) * R, c.y + R * e, c.z + Math.sin(a) * R); cam.lookAt(c);
  r.render(scene, cam); window.ready = true;
});
</script></body></html>
